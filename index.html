    <!--
      Runtime configuration, served by the self-hosted application server. It
      sets window.__AVIATION_APP_CONFIG__, which src/config/runtimeEnv.ts reads
      in preference to the values Vite inlined at build time — so one prebuilt
      installer can serve any customer hostname.

      Deliberately NOT type="module": a classic script blocks until it has run,
      guaranteeing the global exists before the module bundle evaluates. A module
      script is deferred and would race the app's own initialisation.

      Hosted deployments (Vercel) have no such route; the 404 is harmless and the
      app falls back to its build-time values. Hence no `defer` and no `async`.
    -->
    <script src="/config.js"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
