name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin npm to lockfile generator version
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The root tsconfig only includes src/, so without this the Convex backend is
      # first typechecked by `convex deploy` -- turning a type error into a failed
      # production deploy instead of a red build.
      - name: Typecheck Convex functions
        run: npx tsc --noEmit -p convex/tsconfig.json

      - name: Unit tests
        run: npm run test:unit

      - name: Dependency audit (fail on high+)
        run: npm run check:audit

      - name: Build
        run: npx vite build
